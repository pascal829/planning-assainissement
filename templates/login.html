<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Connexion</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <h1>Connexion requise</h1>
  <div class="actions">
    <a href="{{ url_for('index') }}" class="btn">&larr; Retour au planning</a>
  </div>
</header>

<div class="login-box">
  <p>La gestion de la légende et des notes est réservée aux personnes habilitées.</p>
  {% if error %}
    <p class="login-error">{{ error }}</p>
  {% endif %}
  <form method="post">
    <input type="password" name="password" placeholder="Mot de passe" autofocus required>
    <button type="submit" class="btn btn-primary">Se connecter</button>
  </form>
</div>
</body>
</html>
